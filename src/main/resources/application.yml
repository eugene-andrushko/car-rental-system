spring:
  application:
    name: car-rental-system
  datasource:
    url: jdbc:h2:mem:carrental;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

reservation:
  max-days: 30
  booking-horizon: 90d
  calendar-cron: "0 0 0 * * *"
