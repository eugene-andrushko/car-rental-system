spring:
  application:
    name: car-rental-system
  datasource:
    url: jdbc:h2:mem:carrental;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

reservation:
  max-days: 30
  booking-horizon: 90d
